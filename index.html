const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');if(!e.target.matches('h2'))io.unobserve(e.target)}else if(e.target.matches('h2'))e.target.classList.remove('in')}),{threshold:.15}):null;
let hio;function hero(){const h=document.querySelector('.hero'),t=document.querySelector('.htx');if(!h||!t)return;if(!('IntersectionObserver' in window)){h.classList.add('on');return}hio&&hio.disconnect();hio=new IntersectionObserver(es=>es.forEach(e=>h.classList.toggle('on',e.isIntersecting)),{threshold:.3});hio.observe(t)}
let RV=[],lastY=window.scrollY,dir=1,raf=0;
function par(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const vh=innerHeight;document.querySelectorAll('.strip>div').forEach(d=>{const r=d.parentNode.getBoundingClientRect(),o=(r.top+r.height/2-vh/2)/vh;d.style.setProperty('--py',(-o*.14*r.height).toFixed(1)+'px')})}
function reveal(){hero();par();RV=[...document.querySelectorAll('section h2,.ey,.sub,.tq,.three>div,.film,.pk article,.ga,.strip,.us>div,.q form')];RV.forEach(el=>el.classList.add('rv'));tick(true)}
function tick(init){
if(matchMedia('(prefers-reduced-motion:reduce)').matches){RV.forEach(e=>e.classList.add('in'));return}
const y=window.scrollY,vh=innerHeight;if(y!==lastY)dir=y>lastY?1:-1;lastY=y;const Z0=.6*vh,Z1=.97*vh;
for(const el of RV){const t=el.getBoundingClientRect().top,on=el.classList.contains('in'),sl=el.classList.contains('sl');
if(dir>0||init){
if(t<.9*vh){if(!on||sl){el.classList.remove('sl');el.style.opacity='';el.style.transform='';el.classList.add('in')}}
else if(on&&t>vh*1.05){el.classList.remove('in','sl');el.style.opacity='';el.style.transform=''}
}else if(on&&t>Z0){
const p=Math.min(1,(t-Z0)/(Z1-Z0));
if(p>=1){el.classList.remove('in','sl');el.style.opacity='';el.style.transform=''}
else{el.classList.add('sl');el.style.opacity=1-p;el.style.transform='translateY('+(p*22)+'px)'}
}}}
addEventListener('scroll',()=>{raf||(raf=requestAnimationFrame(()=>{raf=0;tick();par()}))},{passive:true});
const PATH='M0 70 H380 l30 -12 l20 54 l40 -96 l40 118 l30 -64 l20 0 H1200';
function render(){
const h=D.hero,c=D.concepto,n=D.nosotros;
$('#app').innerHTML=`<div class="hero" id="top"><div class="htx"><h1>${esc(h.t).split(/(?<=\.)\s/).map((l,i)=>`<span class="ln"><span style="--d:${.15+i*.2}s">${l}</span></span>`).join('')}</h1><p class="lead">${esc(h.s).split(' ').map((w,i)=>`<span class="w" style="--i:${i}">${w}</span>`).join(' ')}</p><div class="hb"><a class="btn" href="#cotizar">Cotiza tu boda</a> <a class="btn o" href="#peliculas">Ver nuestras historias</a></div></div>
<div class="scr">${h.video?`<video src="${esc(h.video)}" autoplay muted loop playsinline></video>`:''}<svg class="pulse" viewBox="0 0 1200 140" preserveAspectRatio="none" aria-hidden="true"><path class="b" pathLength="1" d="${PATH}"/><path class="a" pathLength="1" d="${PATH}" transform="translate(70 0)"/></svg></div>
</div>
<section id="concepto"><p class="ey">01 · Concepto</p><h2>${hd(c.t)}</h2><p class="sub">${esc(c.s)}</p><div class="three">${c.promesas.map(p=>`<div><h3>${esc(p.t)}</h3><p>${esc(p.s)}</p></div>`).join('')}</div></section>
${strip(0)}<section id="peliculas"><p class="ey">02 · Películas</p><h2>Historias que se pueden <em>volver a vivir</em></h2><p class="sub">Pasa el cursor por una película, o tócala, y siente cómo fue ese día.</p><div class="films">${D.films.map((f,i)=>`<button class="film" data-i="${i}"><div class="im" style="${f.img?`background-image:url('${esc(f.img)}')`:''}">${f.video?'<b>▶</b>':''}</div><div class="tx"><h3>${esc(f.t)}</h3><span>${esc(f.lugar)}</span><p>${esc(f.s)}</p></div></button>`).join('')}</div></section>
${strip(1)}<section id="galeria"><p class="ey">03 · Galería</p><h2>Instantes que <em>no se repiten</em></h2><p class="sub">Una selección de fotografías de nuestras bodas y sesiones de pareja.</p><div class="gal">${D.galeria.map((g,i)=>`<button class="ga" data-g="${i}" aria-label="Ver foto ${i+1}">${g.img?`<img loading="lazy" src="${esc(g.img)}" alt="${esc(g.alt)}">`:'<span class="ph2"></span>'}</button>`).join('')}</div></section>
${D.testimonios.some(t=>t.q)?`<section class="dk" id="testimonios"><p class="ey">04 · Testimonios</p><h2>Lo que sintieron al <em>volver a verla</em></h2><div class="tqs">${D.testimonios.filter(t=>t.q).map(t=>`<blockquote class="tq"><p>${esc(t.q)}</p><cite>${esc(t.n)} · ${esc(t.l)}</cite></blockquote>`).join('')}</div></section>`:''}
<section id="paquetes"><p class="ey">05 · Paquetes</p><h2>Elige cómo quieres <em>recordarla</em></h2><p class="sub">Estos valores son una guía. Cada boda es distinta, así que ajustamos todo a tu día.</p><div class="pk">${D.base.map(b=>`<article><h3>${esc(b.n)}</h3><div class="pr">Desde ${cop(b.p)}</div><p>${esc(b.d)}</p><ul class="inc">${String(b.i||'').split(',').filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article>`).join('')}</div></section>
${strip(2)}<section class="q" id="cotizar"><div><p class="ey">06 · Cotizar</p><h2>Cuéntanos cómo <em>imaginas tu día</em></h2><p class="sub">Elige lo que necesitas y verás al instante un rango de inversión. Luego nos escribes por WhatsApp y conversamos los detalles.</p><div class="est" id="est"></div><p class="note">Es un estimado orientativo; el valor final lo definimos juntos.</p></div>
<form id="qf"><label>Servicio<select name="s">${D.base.map((b,i)=>`<option value="${i}"${i==2?' selected':''}>${esc(b.n)}</option>`).join('')}</select></label>
<label>Horas de cobertura<select name="h">${[4,5,6,7,8,9,10,11,12].map(x=>`<option${x==8?' selected':''}>${x}</option>`).join('')}</select></label>
<div class="ex">${D.extras.map((e,i)=>`<label><input type="checkbox" name="e" value="${i}">${esc(e.n)}</label>`).join('')}</div>
<label>Fecha de la boda<input type="date" name="f"></label><label>Ciudad o lugar<input name="c" placeholder="Pasto, Nariño"></label><label>Presupuesto aproximado<input name="b" placeholder="Opcional"></label>
<a class="btn" id="wa" href="#" target="_blank" rel="noopener">Enviar por WhatsApp</a></form></section>
<section id="nosotros"><p class="ey">07 · Nosotros</p><h2>${hd(n.t)}</h2><p class="sub">${esc(n.s)} <a href="https://vmsaudiovisual.com.co" target="_blank" rel="noopener">Conoce Visión MS</a>.</p><div class="us">${n.gente.map(g=>`<div><div class="ph" style="${g.img?`background-image:url('${esc(g.img)}')`:''}"></div><h3>${esc(g.n)}</h3><span class="note">${esc(g.r)}</span></div>`).join('')}</div></section>
${strip(3)}<section class="dk cta"><h2>Tu historia <em>merece quedarse</em></h2><a class="btn" href="#cotizar">Cotiza tu boda</a></section>
<footer><span>Dos Latidos · Fotografía y video de bodas</span><span>Instagram ${esc(D.ig)}</span><a href="https://wa.me/${esc(D.wa)}" target="_blank" rel="noopener">WhatsApp</a></footer>`;
bind();calc();reveal();document.querySelectorAll('.ey').forEach((e,i)=>{e.textContent=String(i+1).padStart(2,'0')+' · '+e.textContent.split(' · ').pop()})}
function calc(){const f=$('#qf');if(!f)return;const b=D.base[+f.s.value],hr=+f.h.value;
const ex=[...f.querySelectorAll('[name=e]:checked')].map(x=>D.extras[+x.value]);
const t=b.p+Math.max(0,hr-4)*D.hora+ex.reduce((a,e)=>a+e.p,0),lo=Math.round(t*.95/50000)*50000,hi=Math.round(t*1.15/50000)*50000;
$('#est').textContent=cop(lo)+' a '+cop(hi);
const m=`Hola, quiero cotizar mi boda con Dos Latidos.\nServicio: ${b.n}\nHoras: ${hr}\nExtras: ${ex.map(e=>e.n).join(', ')||'ninguno'}\nFecha: ${f.f.value||'por definir'}\nLugar: ${f.c.value||'por definir'}\nPresupuesto: ${f.b.value||'por definir'}\nEstimado: ${cop(lo)} a ${cop(hi)}`;
$('#wa').href='https://wa.me/'+D.wa+'?text='+encodeURIComponent(m);}
function bind(){const f=$('#qf');f.addEventListener('input',calc);
document.querySelectorAll('.ga').forEach(b=>b.onclick=()=>{const g=D.galeria[+b.dataset.g];if(!g.img)return;const d=$('#dlg');d.innerHTML=`<img src="${esc(g.img)}" alt="${esc(g.alt)}" style="width:100%;display:block;max-height:90vh;object-fit:contain">`;d.showModal()});
const hov=matchMedia('(hover:hover)').matches;
document.querySelectorAll('.film').forEach(b=>{const x=D.films[+b.dataset.i];if(!x.video)return;const im=b.querySelector('.im'),bd=im.querySelector('b');let v=null;
const mk=()=>{if(!v){v=document.createElement('video');v.src=x.video;v.loop=true;v.muted=true;v.playsInline=true;v.preload='auto';v.addEventListener('playing',()=>v.classList.add('on'));im.insertBefore(v,bd)}return v};
const lab=()=>{const p=v&&!v.paused;bd.className=p?'t':'';bd.textContent=p?(v.muted?'Toca para activar el sonido':'Toca para silenciar'):'▶'};
const play=m=>{const p=mk();p.muted=m;p.play().catch(()=>{p.muted=true;p.play().catch(()=>{})});b.classList.add('pl');lab()};
const stop=()=>{if(!v)return;v.pause();v.classList.remove('on');v.currentTime=0;v.muted=true;b.classList.remove('pl');lab()};
if(hov){b.addEventListener('mouseenter',()=>play(true));b.addEventListener('mouseleave',stop);b.addEventListener('focus',()=>play(true));b.addEventListener('blur',stop);b.onclick=()=>{if(!v||v.paused)play(false);else{v.muted=!v.muted;lab()}}}
else b.onclick=()=>{if(v&&!v.paused)stop();else play(false)}});}
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg'){e.target.close();e.target.innerHTML=''}});
$('#th').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).colorScheme==='dark';r.dataset.theme=d?'light':'dark'};
render();
/* Panel de administración: solo aparece para quien puede editar la página */
const get=(p)=>p.split('.').reduce((o,k)=>o[k],D),setv=(p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((o,x)=>o[x],D)[l]=v};
function fld(o,p){return Object.keys(o).map(k=>{const q=p?p+'.'+k:k,v=o[k];
if(Array.isArray(v))return`<fieldset><legend>${k}</legend>${v.map((x,i)=>typeof x==='object'?`<div class="it">${fld(x,q+'.'+i)}<button data-del="${q}.${i}">Quitar</button></div>`:'').join('')}<button data-add="${q}">Agregar</button></fieldset>`;
if(typeof v==='object')return`<fieldset><legend>${k}</legend>${fld(v,q)}</fieldset>`;
const med=k==='img'||k==='video';
return`<label>${k}<input data-p="${q}" value="${esc(v)}"${typeof v==='number'?' type="number"':''}></label>${med?`<label>Subir archivo<input type="file" data-up="${q}" accept="${k==='img'?'image/*':'video/*'}"></label>`:''}`}).join('')}
function panel(){$('#pnl').innerHTML=`<h2 style="font-size:1.6rem">Editar sitio</h2><p class="note">Cambia textos, precios, películas y archivos. Al guardar, la página se actualiza para todos.</p>${fld(D,'')}<div class="sv"><button class="btn" id="sv">Guardar y publicar</button> <button id="cl">Cerrar</button><p class="note" id="msg"></p></div>`;$('#cl').onclick=()=>$('#pnl').classList.remove('on')}
(async()=>{try{if(!window.claude)return;const u=await claude.use('user');if(!u||!u.canEdit())return;
const art=await claude.use('artifact'),as=await claude.use('assets');if(!art)return;
$('#adm').hidden=false;panel();$('#edb').onclick=()=>$('#pnl').classList.toggle('on');
const P=$('#pnl');
P.addEventListener('input',e=>{const p=e.target.dataset.p;if(!p)return;setv(p,e.target.type==='number'?+e.target.value:e.target.value);render()});
P.addEventListener('click',e=>{const t=e.target;if(t.dataset.del){const k=t.dataset.del.split('.'),i=+k.pop();k.reduce((o,x)=>o[x],D).splice(i,1);panel();render()}
if(t.dataset.add){const a=get(t.dataset.add),m=a[0]||{},n={};for(const x in m)n[x]=typeof m[x]==='number'?0:'';a.push(n);panel();render()}
if(t.id==='sv')save()});
P.addEventListener('change',async e=>{const p=e.target.dataset.up;if(!p||!as||!e.target.files[0])return;$('#msg').textContent='Subiendo archivo…';
try{const r=await as.upload(e.target.files[0]);setv(p,r.url);panel();render()}catch(x){$('#msg').textContent='No se pudo subir el archivo: '+(x.message||x.code||'error')}});
async function save(){$('#msg').textContent='Guardando…';const j=JSON.stringify(D).replace(/</g,'\\u003c');
const html=SRC.replace(/(<script id="d" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+j+b);
try{await art.publish(html)}catch(x){$('#msg').textContent='No se pudo guardar: '+(x.message||x.code||'error')}}
}catch(e){}})();
</script>
