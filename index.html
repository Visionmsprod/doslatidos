let RV=[],lastY=window.scrollY,dir=1,raf=0;
function par(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const vh=innerHeight;document.querySelectorAll('.strip>div').forEach(d=>{const r=d.parentNode.getBoundingClientRect(),o=(r.top+r.height/2-vh/2)/vh;d.style.setProperty('--py',(-o*.14*r.height).toFixed(1)+'px')})}
function reveal(){hero();par();RV=[...document.querySelectorAll('section h2,.ey,.sub,.tq,.three>div,.film,.pk article,.ga,.strip,.us>div,.q form')];RV.forEach(el=>el.classList.add('rv'));tick(true)}
function tick(init){
if(matchMedia('(prefers-reduced-motion:reduce)').matches){RV.forEach(e=>e.classList.add('in'));return}
const y=window.scrollY,vh=innerHeight;if(y!==lastY)dir=y>lastY?1:-1;lastY=y;const Z0=.6*vh,Z1=.97*vh;
for(const el of RV){const t=el.getBoundingClientRect().top,on=el.classList.contains('in'),sl=el.classList.contains('sl');
if(dir>0||init){
if(t<.9*vh){if(!on||sl){el.classList.remove('sl');el.style.opacity='';el.style.transform='';el.classList.add('in')}}
else if(on&&t>vh*1.05){el.classList.remove('in','sl');el.style.opacity='';el.style.transform=''}
}else if(on&&t>Z0){
const p=Math.min(1,(t-Z0)/(Z1-Z0));
if(p>=1){el.classList.remove('in','sl');el.style.opacity='';el.style.transform=''}
else{el.classList.add('sl');el.style.opacity=1-p;el.style.transform='translateY('+(p*22)+'px)'}
}}}

 {t:'Adicionales',list:'extras',add:'Agregar adicional',title:'n',item:[T('Nombre','n'),T('Precio','p','num')]},
 {t:'Otros',f:[T('Hora adicional: % del valor total por cada hora','hora','num'),T('Condiciones','cond','area')]}]},
{id:'nos',n:'Nosotros',b:[{t:'Texto',f:[T('Título','nosotros.t'),T('Texto','nosotros.s','area')]},{t:'Personas',list:'nosotros.gente',fixed:1,title:'n',item:[T('Nombre','n'),T('Rol','r'),T('Foto','img','img')]}]},
{id:'tes',n:'Testimonios',b:[{t:'Testimonios',note:'La sección se oculta sola si no hay ninguno con texto.',list:'testimonios',add:'Agregar testimonio',title:'n',item:[T('Testimonio','q','area'),T('Nombres','n'),T('Lugar','l')]}]},
{id:'con',n:'Contacto',b:[{t:'Contacto',f:[T('WhatsApp (con código de país, sin +)','wa'),T('Instagram','ig')]}]}];
let TAB='inicio',tm=0;
const fld=(f,p)=>{const v=gv(p);
if(f.t==='area')return`<label class="ed">${f.l}<textarea data-p="${p}" rows="3">${esc(v)}</textarea></label>`;
if(f.t==='img'||f.t==='video')return`<div class="ed"><span>${f.l}</span><div class="fu">${v?(f.t==='img'?`<img src="${esc(v)}" alt="">`:`<video src="${esc(v)}" muted></video>`):'<em>Sin archivo</em>'}<label class="fb">${v?'Cambiar':'Subir'}<input type="file" data-up="${p}" accept="${f.t==='img'?'image/*':'video/*'}" hidden></label>${v?`<button data-clr="${p}">Quitar</button>`:''}</div></div>`;
return`<label class="ed">${f.l}<input data-p="${p}"${f.t==='num'?' type="number"':f.t==='date'?' type="date"':''} value="${esc(v)}"></label>`};
const lst=b=>{const arr=gv(b.list)||[];return arr.map((it,k)=>`<details class="it"${arr.length<=3||k==0?' open':''}><summary>${esc(it[b.title]||('Elemento '+(k+1)))}<span class="ac">${b.fixed?'':`<button data-mv="${b.list}:${k}:-1">↑</button><button data-mv="${b.list}:${k}:1">↓</button><button data-del="${b.list}.${k}">Quitar</button>`}</span></summary>${b.item.map(f=>fld(f,b.list+'.'+k+'.'+f.k)).join('')}</details>`).join('')+(b.add?`<button class="addb" data-add="${b.list}">+ ${b.add}</button>`:'')};
const gal=()=>`<div class="ed"><span>Agregar fotos</span><label class="fb big">+ Elegir fotos<input type="file" id="gm" multiple accept="image/*" hidden></label><p class="note" id="gmsg">Puedes elegir varias a la vez. Se reducen solas para que la página cargue rápido.</p></div><div class="gg">${D.galeria.map((g,k)=>`<figure>${g.img?`<img src="${esc(g.img)}" alt="">`:'<span class="ph2"></span>'}<input data-p="galeria.${k}.alt" value="${esc(g.alt)}" placeholder="Descripción"><div class="ac"><button data-mv="galeria:${k}:-1">←</button><button data-mv="galeria:${k}:1">→</button><button data-del="galeria.${k}">✕</button></div></figure>`).join('')}</div>`;
function panel(){const s=SC.find(x=>x.id===TAB);$('#pnl').innerHTML=`<header class="ph"><h2>Editar sitio</h2><button class="x" id="cl" aria-label="Cerrar">✕</button></header><nav class="tb">${SC.map(x=>`<button data-tab="${x.id}" class="${x.id===TAB?'on':''}">${x.n}</button>`).join('')}</nav><div class="pb">${s.gallery?gal():s.b.map(b=>`<section class="bk">${b.t?`<h3>${b.t}</h3>`:''}${b.note?`<p class="note">${b.note}</p>`:''}${b.f?b.f.map(f=>fld(f,f.k)).join(''):lst(b)}</section>`).join('')}</div><footer class="pf"><button class="btn" id="sv">Guardar y publicar</button><p class="note" id="msg">Los cambios se ven al instante aquí; guarda para publicarlos.</p></footer>`;$('#cl').onclick=()=>$('#pnl').classList.remove('on')}
const shrink=(f,m)=>new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);r(b?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f)},'image/jpeg',.86)};i.onerror=()=>r(f);i.src=u});
(async()=>{try{if(!window.claude)return;const u=await claude.use('user');if(!u||!u.canEdit())return;
const art=await claude.use('artifact'),as=await claude.use('assets');if(!art)return;
$('#adm').hidden=false;panel();$('#edb').onclick=()=>$('#pnl').classList.toggle('on');
const P=$('#pnl');
P.addEventListener('input',e=>{const p=e.target.dataset.p;if(!p)return;setv(p,e.target.type==='number'?+e.target.value:e.target.value);clearTimeout(tm);tm=setTimeout(render,350)});
P.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.tab){TAB=t.dataset.tab;panel();return}
if(t.dataset.del||t.dataset.mv)e.preventDefault();
if(t.dataset.del){if(t.dataset.arm!=='1'){t.dataset.arm='1';t.dataset.o=t.textContent;t.textContent='¿Seguro?';setTimeout(()=>{t.dataset.arm='';t.textContent=t.dataset.o},2500);return}
const k=t.dataset.del.split('.'),i=+k.pop();get(k.join('.')).splice(i,1);panel();render();return}
if(t.dataset.mv){const[l,k,d]=t.dataset.mv.split(':'),a=get(l),i=+k,j=i+ +d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];panel();render();return}
if(t.dataset.add){const a=get(t.dataset.add),m=a[0]||{},n={};for(const x in m)n[x]=typeof m[x]==='number'?0:'';a.push(n);panel();render();return}
if(t.dataset.clr){setv(t.dataset.clr,'');panel();render();return}
if(t.id==='sv')save()});
P.addEventListener('change',async e=>{const t=e.target;
if(t.id==='gm'){if(!as)return;const fs=[...t.files],m=$('#gmsg');let n=0;for(const f of fs){try{m.textContent='Subiendo '+(n+1)+' de '+fs.length+'…';const r=await as.upload(await shrink(f,1600));D.galeria.push({img:r.url,alt:'Foto de boda'});n++}catch(x){m.textContent='No se pudo subir '+f.name+': '+(x.message||x.code||'error');break}}if(n){render();panel()}return}
const p=t.dataset.up;if(!p||!as||!t.files[0])return;const m=$('#msg');m.textContent='Subiendo archivo…';
try{const f=t.files[0],r=await as.upload(f.type.startsWith('image/')?await shrink(f,2000):f);setv(p,r.url);panel();render();$('#msg').textContent='Archivo subido.'}catch(x){m.textContent='No se pudo subir: '+(x.message||x.code||'error')}});
async function save(){$('#msg').textContent='Guardando…';const j=JSON.stringify(D).replace(/</g,'\\u003c');
const html=SRC.replace(/(<script id="d" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+j+b);
try{await art.publish(html)}catch(x){$('#msg').textContent='No se pudo guardar: '+(x.message||x.code||'error')}}
}catch(e){}})();
</script>
</body>
</html>
